[workspace]

[package]
name = "cadence-native-rs"
version = "0.1.0"
edition = "2021"

# The shim's JNI + (incrementally) its orchestration in Rust. Builds libcadence-native.so, the
# library NativeWrapper loads, replacing the C++ native_wrapper.cpp JNI. The StoreServices C++ glue
# (native_core.c + the bridges + a small support TU) is compiled in via cc and called through the
# flat-C core_wrapper_* boundary; the closed Apple blobs are linked as before.
[lib]
name = "cadence_native"
crate-type = ["cdylib"]

[dependencies]
cadence-alac = { path = "../cadence-alac" }
cadence-eac3 = { path = "../cadence-eac3" }
cadence-hooks = { path = "../cadence-hooks" }
# Los ports que reemplazan logica de las librerias cerradas. apple-ss-sys aporta el ABI
# (los tipos de layout y el catalogo de los 62 simbolos); los otros tres son Rust puro y
# son la fuente de verdad de los valores que antes estaban a mano en core.rs.
apple-ss-sys = { path = "../apple-ss-sys" }
device-guid = { path = "../device-guid" }
fairplay-proto = { path = "../fairplay-proto" }
store-config = { path = "../store-config" }
jni = "0.21"
libc = "0.2"

[features]
# Device self-test of the C++ exception guard (never in release builds). See src/selftest.rs.
selftest = []

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
# "unwind" is required for cxx_guard (an Apple C++ throw through Rust frames aborts under "abort").
# JNI_OnLoad installs an abort panic hook, so Rust panics still kill the process.
panic = "unwind"
