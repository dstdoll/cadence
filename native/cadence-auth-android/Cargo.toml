[package]
name = "cadence-auth-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The core crate is not part of this repository; the prebuilt library is
# backend/src/main/jniLibs/arm64-v8a/libcadence_auth_android.so.
auth-core = { path = "../vendor/auth-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
jni = "0.21"
