[workspace]

[package]
name = "vectors-sample"
description = "Generates native/vectors.sample.json: reference capture without device data"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
publish = false

[dependencies]
device-guid = { path = "../device-guid" }
fairplay-proto = { path = "../fairplay-proto" }
store-config = { path = "../store-config" }
# preserve_order: the CKC body keeps keys in struct order, not alphabetical.
# Without this, the sample would describe an order the app never sends.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
