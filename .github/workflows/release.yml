name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name without v prefix (e.g. 0.2.0-dev.1 or 0.2.0)'
        required: true
      version_code:
        description: 'Strictly monotonic integer versionCode (e.g. 9)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and channel
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
            TAG="v${VERSION_NAME}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
            GRADLE_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            GRADLE_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | sed -E 's/.*\?: ([0-9]+).*/\1/')
            if [ "$VERSION_NAME" != "$GRADLE_VER" ]; then
              echo "Tag version ($VERSION_NAME) does not match app/build.gradle.kts ($GRADLE_VER)" >&2
              exit 1
            fi
            VERSION_CODE="$GRADLE_CODE"
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer versionName: $VERSION_NAME" >&2
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -lt 1 ]; then
            echo "Invalid versionCode: $VERSION_CODE" >&2
            exit 1
          fi

          if [[ "$VERSION_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        run: |
          if [ -z "${{ secrets.CADENCE_KEYSTORE_BASE64 }}" ]; then
            echo "Missing CADENCE_KEYSTORE_BASE64 secret. Refusing to publish with an ephemeral runner key." >&2
            exit 1
          fi
          echo "${{ secrets.CADENCE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > "$RUNNER_TEMP/signing.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.CADENCE_STORE_PASSWORD }}
          keyAlias=${{ secrets.CADENCE_KEY_ALIAS }}
          keyPassword=${{ secrets.CADENCE_KEY_PASSWORD }}
          EOF
          echo "CADENCE_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :backend:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Build optimized release APK
        run: >
          ./gradlew :app:assembleRelease
          -Pcadence.versionCode=${{ steps.meta.outputs.version_code }}
          -Pcadence.versionName=${{ steps.meta.outputs.version_name }}
          --no-daemon

      - name: Verify APK signature and alignment
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n1)
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" > /dev/null
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
