name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Rust E-AC-3 build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/cadence-eac3/target
          key: ${{ runner.os }}-cargo-eac3-${{ hashFiles('native/cadence-eac3/Cargo.lock', 'native/cadence-eac3/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-eac3-

      - name: Run unit tests
        run: ./gradlew :backend:testDebugUnitTest :app:testDebugUnitTest --build-cache --no-daemon

      - name: Cache ffmpeg binary
        uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/.local/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-btbn-v1

      - name: Install ffmpeg for E-AC-3 reference tests
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/bin
          if curl -fsSL --retry 3 --max-time 60 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --wildcards --strip-components=2 -C ~/.local/bin '*/bin/ffmpeg'; then
            chmod +x ~/.local/bin/ffmpeg
          else
            sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg
          fi

      - name: Run Rust E-AC-3 tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cargo test --manifest-path native/cadence-eac3/Cargo.toml

      - name: Upload Gradle test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: |
            app/build/reports/tests
            backend/build/reports/tests
          retention-days: 7
