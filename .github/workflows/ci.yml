name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :backend:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Install ffmpeg for E-AC-3 reference tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Rust E-AC-3 tests
        run: cargo test --manifest-path native/cadence-eac3/Cargo.toml
