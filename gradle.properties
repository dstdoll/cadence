# Sized for a ~8 GB machine: modest heap, and the daemon exits after 10 idle minutes instead of 3 hours.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=600000
# Compile Kotlin inside the Gradle daemon rather than spawning a second long-lived JVM.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
